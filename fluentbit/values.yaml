# 1. Montiamo il tuo SSD fisico dentro il container
extraVolumes:
  - name: z-acquisitions
    hostPath:
      path: /z_acquisitions/fluentbit-wal
      type: DirectoryOrCreate

extraVolumeMounts:
  - name: z-acquisitions
    mountPath: /z_acquisitions/fluentbit-wal

config:
  service: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        storage.path  /z_acquisitions/fluentbit-wal
        storage.sync  normal
        storage.checksum off
        storage.backlog.mem_limit 5M

  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        multiline.parser  docker, cri
        Tag               kube.*
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        storage.type      filesystem

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Merge_Log_Key       log_processed
    
    [FILTER]
        Name                nest
        Match               kube.*
        Operation           lift
        Nested_under        kubernetes

    [FILTER]
        Name                modify
        Match               kube.*
        Rename              namespace_name namespace
        Rename              pod_name pod
        Rename              container_name container

    [FILTER]
        Name            record_modifier
        Match           kube.*
        Allowlist_key   log
        Allowlist_key   namespace
        Allowlist_key   pod
        Allowlist_key   container

  outputs: |
    [OUTPUT]
        Name              loki
        Match             kube.*
        Host              loki.zeit
        Port              80

        Labels            job=fluentbit-edge, cluster=edge-due
        Label_Keys        $namespace, $pod, $container
        Remove_Keys       namespace, pod, container
        drop_single_key   On
        Retry_Limit       False
        net.connect_timeout 5
        net.io_timeout      5