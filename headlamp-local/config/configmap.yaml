apiVersion: v1
kind: ConfigMap
metadata:
  name: headlamp-bypass-config
  namespace: headlamp
data:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
    - cluster:
        certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        server: https://kubernetes.default.svc
      name: in-cluster
    contexts:
    - context:
        cluster: in-cluster
        user: in-cluster-sa
      name: default
    current-context: default
    users:
    - name: in-cluster-sa
      user:
        tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token