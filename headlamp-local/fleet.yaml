defaultNamespace: headlamp
helm:
  repo: https://kubernetes-sigs.github.io/headlamp/
  chart: headlamp
  releaseName: headlamp
  values:
    serviceAccount:
      create: true
    clusterRoleBinding:
      create: true
      
    service:
      type: NodePort
      nodePort: 32000

    config:
      inCluster: true
      unsafeUseServiceAccountToken: true