defaultNamespace: headlamp
helm:
  repo: https://kubernetes-sigs.github.io/headlamp/
  chart: headlamp
  releaseName: headlamp
  values:
    # 1. Assegna i privilegi massimi (Admin) al ServiceAccount del Pod
    serviceAccount:
      create: true
    clusterRoleBinding:
      create: true
      clusterRoleName: view

    # 2. Esponi il servizio sull'IP Wi-Fi Edge
    service:
      type: NodePort
      nodePort: 32000

    # 3. Forza Headlamp a usare il kubeconfig per saltare il login
    config:
      inCluster: false
      extraArgs:
        - "-kubeconfig=/mnt/kubeconfig"

    # 4. Monta fisicamente il ConfigMap nel container
    extraVolumes:
      - name: bypass-volume
        configMap:
          name: headlamp-bypass-config
    extraVolumeMounts:
      - name: bypass-volume
        mountPath: /mnt