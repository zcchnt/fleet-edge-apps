name: Compila e Pubblica su GHCR

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Imposta Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Aggiorna il file deployment.yaml con il nuovo SHA
      run: |
        # Configura l'identità Git del bot di GitHub Actions
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Sostituisce il tag nel file deployment.yaml con lo SHA corrente del commit
        # (Assicurati che il percorso del file e la ricerca dell'immagine corrispondano ai tuoi)
        sed -i 's|image: ghcr.io/tuonome/tua-repo:.*|image: ghcr.io/tuonome/tua-repo:${{ github.sha }}|g' deployment.yaml
        
        # Registra la modifica, fa il commit e il push sul ramo main
        git commit -am "Aggiorna immagine a ${{ github.sha }}"
        git push


      - name: Build e Push dell'immagine
        uses: docker/build-push-action@v5
        with:
          context: ./automatic-log       
          file: ./automatic-log/Dockerfile 
          push: true
          tags: ghcr.io/zcchnt/fleet-edge-apps:${{ github.sha }}