name: Compila e Pubblica su GHCR
s
on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Imposta Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Converti repository in minuscolo
        id: string_case
        uses: inner-telecom/uppercase-action@v1 
        with:
          string: ${{ github.repository }}

      - name: Build e Push dell'immagine
        uses: docker/build-push-action@v5
        with:
          context: ./automatic-log       
          file: ./automatic-log/Dockerfile 
          push: true
          tags: ghcr.io/zcchnt/fleet-edge-apps:latest