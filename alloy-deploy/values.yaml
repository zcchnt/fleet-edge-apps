controller:
  type: daemonset

alloy:
  # 1. Montiamo la cartella fisica del nodo dove vengono scritti i log
  extraVolumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
  
  extraVolumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true

  configMap:
    content: |-
      loki.write "default" {
        endpoint {
          url = "http://loki.192.168.1.160.nip.io/loki/api/v1/push"
        }
        wal {
          enabled = true
          max_segment_age = "24h"
        }
      }

      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets
        
        //Novità: Costruiamo il percorso fisico del file di log sul nodo (standard K3s)
        rule {
          source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name", "__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          target_label  = "__path__"
          replacement   = "/var/log/pods/$1_$2_$3/$4/*.log"
        }
        
        //Le tue etichette originali
        rule {
          target_label = "cluster"
          replacement  = "edge-poc"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
      }

      //Abbiniamo i percorsi fisici calcolati sopra
      local.file_match "pod_logs" {
        path_targets = discovery.relabel.pod_logs.output
      }

      //Leggiamo i file direttamente dal disco, ignorando le API di rete
      loki.source.file "local_pods" {
        targets    = local.file_match.pod_logs.targets
        forward_to = [loki.write.default.receiver]
      }