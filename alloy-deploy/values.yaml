controller:
  type: daemonset

alloy:
  extraVolumes:
    - name: wal-storage
      hostPath:
        path: /var/lib/alloy-wal
        type: DirectoryOrCreate
  
  extraVolumeMounts:
    - name: wal-storage
      mountPath: /var/lib/alloy/data/wal

  configMap:
    content: |-
      loki.write "default" {
        endpoint {
          url = "http://loki.192.168.1.160.nip.io/loki/api/v1/push"
        }
        wal {
          enabled = true
          dir = "/var/lib/alloy/data/wal" # Aggiunto il percorso del disco fisico
          max_segment_age = "24h"
        }
      }

      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets
        
        rule {
          target_label = "cluster"
          replacement  = "edge-poc"
        }
        
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
      }

      loki.source.kubernetes "local_pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.write.default.receiver]
      }