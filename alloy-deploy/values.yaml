controller:
  type: daemonset

alloy:
  extraVolumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
  
  extraVolumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true

  configMap:
    content: |-
      loki.write "default" {
        endpoint {
          url = "http://loki.192.168.1.160.nip.io/loki/api/v1/push"
        }
        wal {
          enabled = true
          max_segment_age = "24h"
        }
      }

      // 1. Ricerca pura dei file fisici, senza MAI contattare le API K8s
      local.file_match "node_logs" {
        path_targets = [{"__path__" = "/var/log/pods/*/*/*.log"}]
      }

      // 2. Estrazione delle etichette (namespace, pod, container) usando Regex sul nome cartella
      discovery.relabel "pod_logs" {
        targets = local.file_match.node_logs.targets
        
        rule {
          source_labels = ["__path__"]
          regex         = "/var/log/pods/([^_]+)_([^_]+)_([^/]+)/([^/]+)/.*\\.log"
          target_label  = "namespace"
          replacement   = "$1"
        }
        rule {
          source_labels = ["__path__"]
          regex         = "/var/log/pods/([^_]+)_([^_]+)_([^/]+)/([^/]+)/.*\\.log"
          target_label  = "pod"
          replacement   = "$2"
        }
        rule {
          source_labels = ["__path__"]
          regex         = "/var/log/pods/([^_]+)_([^_]+)_([^/]+)/([^/]+)/.*\\.log"
          target_label  = "container"
          replacement   = "$4"
        }
        rule {
          target_label = "cluster"
          replacement  = "edge-poc"
        }
      }

      // 3. Lettura diretta dal disco
      loki.source.file "local_pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.write.default.receiver]
      }